services:
  - type: web
    name: ai-civic-guardian
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: civic-guardian-db
          property: connectionString

databases:
  - name: civic-guardian-db
    plan: free
    databaseName: civic_guardian
    user: civic_admin
